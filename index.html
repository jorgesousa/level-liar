<meta name="mobile-web-app-capable" content="yes">

<style>
/* page basics: safe-area padding and a small reset */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}

<style>
/* Layout: one 16:9 stage centered in the viewport. On touch screens the pad docks under the stage in portrait and floats over its lower corners in landscape. Single committed look: cobalt night, ink platforms, coral danger, sunflower hero. */
:root{
  --cobalt:#3341D8;
  --cobalt-deep:#1F28A3;
  --ink:#0C1045;
  --ink-2:#161C66;
  --sun:#FFD23F;
  --coral:#FF4F6D;
  --bone:#F2EFFF;
  --bone-dim:rgba(242,239,255,.62);
  --font-display:"Bungee", Impact, "Arial Black", sans-serif;
  --font-mono:"DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--ink)}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%;margin:0;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 35%, var(--ink-2) 0%, var(--ink) 70%);
  color:var(--bone);font-family:var(--font-mono);font-size:14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
#app{height:100%;display:flex;flex-direction:column}
#stageWrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding-block:10px}
#stage{position:relative;border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px rgba(242,239,255,.07),0 30px 70px rgba(0,0,0,.5);background:var(--cobalt-deep)}
#stage canvas{display:block;width:100%;height:100%}
.sbtns{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.sbtn{
  width:34px;height:34px;border-radius:9px;border:1.5px solid rgba(242,239,255,.25);
  background:rgba(12,16,69,.55);color:var(--bone);display:grid;place-items:center;padding:0;cursor:pointer;
}
.sbtn:hover{border-color:var(--sun);color:var(--sun)}
.sbtn:focus-visible,.btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* touch pad */
#pad{display:none;position:relative}
body.touch #pad{display:flex;justify-content:space-between;align-items:center}
.dpad{display:flex;gap:10px;touch-action:none}
.pbtn{
  display:grid;place-items:center;touch-action:none;
  width:clamp(66px,20vw,92px);height:clamp(66px,20vw,92px);
  border-radius:24px;border:2px solid rgba(242,239,255,.26);
  background:rgba(12,16,69,.62);color:var(--bone);
  transition:transform .08s ease, background-color .08s ease;
}
.pbtn.on{background:var(--sun);border-color:var(--sun);color:var(--ink);transform:scale(.95)}
.pbtn.jump{border-radius:50%;width:clamp(84px,25vw,112px);height:clamp(84px,25vw,112px);font-family:var(--font-display);font-size:16px;letter-spacing:.04em;border-color:rgba(255,210,63,.55);color:var(--sun)}
.pbtn.jump.on{color:var(--ink)}
#rot{position:absolute;left:0;right:0;top:4px;margin:0;text-align:center;font-size:11px;color:var(--bone-dim);letter-spacing:.04em;pointer-events:none}
@media (orientation:portrait){
  body.touch #pad{flex:0 0 auto;height:min(40vh,290px);padding-bottom:10px}
}
@media (orientation:landscape){
  body.touch #pad{
    position:fixed;left:0;right:0;bottom:0;align-items:flex-end;pointer-events:none;
    padding:0 max(14px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  }
  body.touch #pad > .dpad, body.touch #pad > .pbtn{pointer-events:auto;opacity:.86}
  body.touch .pbtn{width:clamp(56px,17vh,82px);height:clamp(56px,17vh,82px);border-radius:20px}
  body.touch .pbtn.jump{width:clamp(66px,20vh,96px);height:clamp(66px,20vh,96px);border-radius:50%}
  #rot{display:none}
}

/* overlays */
.overlay{
  position:fixed;inset:0;z-index:20;display:grid;place-items:center;overflow:auto;
  padding:max(18px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  background:rgba(7,10,44,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  touch-action:auto;
}
.card{width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--sun)}
.eyebrow s{text-decoration-color:var(--coral);text-decoration-thickness:2px;color:var(--bone-dim)}
.logo{
  margin:4px 0 6px;font-family:var(--font-display);font-weight:400;line-height:.84;
  font-size:clamp(52px, min(16vw, 17vh), 132px);display:flex;flex-direction:column;
  transform:rotate(-4deg);transform-origin:left bottom;
}
.logo .l1{color:var(--bone)}
.logo .l2{color:var(--sun);text-shadow:.055em .055em 0 var(--coral);animation:fib 4.2s steps(1) infinite}
@keyframes fib{0%,88%,100%{transform:none}89%{transform:translate(.04em,-.02em) skewX(-6deg)}91%{transform:translate(-.03em,.01em)}93%{transform:none}}
.tag{margin:0;font-size:clamp(14px,2.4vw,17px);line-height:1.5;color:var(--bone);max-width:44ch;text-wrap:balance}
.tag em{font-style:normal;color:var(--coral)}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}
.btn{
  font-family:var(--font-display);font-size:17px;letter-spacing:.02em;
  padding:14px 22px;border-radius:12px;border:0;cursor:pointer;
  background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--coral);
  transition:transform .08s ease, box-shadow .08s ease;
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--coral)}
.btn.ghost{background:transparent;color:var(--bone);box-shadow:inset 0 0 0 2px rgba(242,239,255,.35)}
.btn.ghost:active{transform:translateY(2px)}
.btn.small{font-size:12px;padding:9px 14px;font-family:var(--font-mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.hint{margin:0;font-size:12.5px;line-height:1.6;color:var(--bone-dim);max-width:52ch}
.hint kbd{font-family:var(--font-mono);font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid rgba(242,239,255,.3);color:var(--bone)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;font-size:12px;color:var(--bone-dim)}
.meta b{color:var(--sun);font-weight:500}
.endTitle{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(34px, min(9vw, 11vh), 72px);line-height:.95;color:var(--bone);text-wrap:balance}
.endTitle span{color:var(--sun);text-shadow:.05em .05em 0 var(--coral)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0}
.stats div{border:2px solid rgba(242,239,255,.16);border-radius:12px;padding:12px 14px}
.stats dt{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-dim)}
.stats dd{margin:4px 0 0;font-family:var(--font-display);font-size:clamp(28px,6vw,40px);color:var(--sun);font-variant-numeric:tabular-nums}
.verdict{margin:0;font-size:16px;line-height:1.5}
.share{margin:0;font-size:12.5px;color:var(--bone-dim);-webkit-user-select:text;user-select:text}
@media (prefers-reduced-motion: reduce){.logo .l2{animation:none}.pbtn{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <div id="stage">
      <canvas id="game" aria-label="Level Liar game"></canvas>
      <div class="sbtns">
        <button id="bRestart" class="sbtn" aria-label="Restart level" title="Restart level (R)">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="bPause" class="sbtn" aria-label="Pause" title="Pause (Esc)">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M17 4v16" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div id="pad" aria-hidden="true">
    <p id="rot">Turn your phone sideways for a bigger stage</p>
    <div id="dpad" class="dpad">
      <div class="pbtn" id="bL"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="pbtn" id="bR"><svg viewBox="0 0 24 24" width="30" height="30"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <div class="pbtn jump" id="bJ">JUMP</div>
  </div>
</div>

<div id="menu" class="overlay" hidden>
  <div class="card">
    <p class="eyebrow">An <s>honest</s> platformer</p>
    <h1 class="logo"><span class="l1">LEVEL</span><span class="l2">LIAR</span></h1>
    <p class="tag">Ten levels. Each one makes you a promise. <em>Every single promise is a lie.</em></p>
    <div class="btns">
      <button id="bPlay" class="btn">Play</button>
      <button id="bNew" class="btn ghost" hidden>New run</button>
    </div>
    <p class="hint" id="hint"></p>
    <div class="meta">
      <button id="bSound" class="btn ghost small">Sound: on</button>
      <span id="best"></span>
    </div>
  </div>
</div>

<div id="end" class="overlay" hidden>
  <div class="card">
    <p class="eyebrow">Run complete · 10 of 10 lies exposed</p>
    <h2 class="endTitle">You outlasted <span>the liar.</span></h2>
    <dl class="stats">
      <div><dt>Deaths</dt><dd id="eDeaths">0</dd></div>
      <div><dt>Time</dt><dd id="eTime">0:00</dd></div>
    </dl>
    <p class="verdict" id="eVerdict"></p>
    <p class="share" id="eShare"></p>
    <div class="btns">
      <button id="bCopy" class="btn ghost">Copy result</button>
      <button id="bAgain" class="btn">Play again</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
/* ---------- constants ---------- */
const W = 960, H = 540, T = 30, PW = 22, PH = 26, SH = 18;
const GRAV = 2200, JV = 720, SPEED = 270, STEP = 1 / 120;
const COL = {
  cobalt: '#3341D8', deep: '#1F28A3', ink: '#0C1045', inkHi: '#2E3BB8', speck: '#19217F',
  sun: '#FFD23F', sunDeep: '#E5A100', coral: '#FF4F6D', coralHi: '#FF97A6', coralDeep: '#C4224A', bone: '#F2EFFF'
};
const FD = 'Bungee, Impact, "Arial Black", sans-serif';
const FM = '"DM Mono", ui-monospace, Menlo, Consolas, monospace';
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad2 = n => String(n).padStart(2, '0');
const EASE = {
  linear: k => k, in: k => k * k, out: k => 1 - (1 - k) * (1 - k),
  inout: k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2
};
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const q = s => document.querySelector(s);

/* ---------- storage (per-viewer convenience only) ---------- */
const SKEY = 'level-liar-v1';
let store = { run: null, best: null, muted: false };
try { const s = JSON.parse(localStorage.getItem(SKEY)); if (s && typeof s === 'object') store = Object.assign(store, s); } catch (e) {}
function save() { try { localStorage.setItem(SKEY, JSON.stringify(store)); } catch (e) {} }

/* ---------- audio (synthesised, starts on first tap) ---------- */
let AC = null, master = null, noiseBuf = null;
function unlockAudio() {
  try {
    if (!AC) {
      const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
      AC = new A(); master = AC.createGain(); master.gain.value = .55; master.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function tone(f, dur, type = 'square', vol = .06, f2 = null, delay = 0) {
  if (!AC || store.muted) return;
  try {
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
function noise(dur, vol = .1, freq = 1000, delay = 0) {
  if (!AC || store.muted) return;
  try {
    if (!noiseBuf) {
      noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate * .6), AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .02);
  } catch (e) {}
}
const SFX = {
  jump() { tone(360, .14, 'square', .04, 760); },
  land() { noise(.06, .06, 700); },
  die() { noise(.42, .22, 1500); tone(320, .42, 'sawtooth', .07, 45); },
  trap() { tone(1250, .1, 'triangle', .07, 420); },
  shing() { tone(1900, .07, 'square', .035, 2800); noise(.06, .06, 5000); },
  rumble() { noise(.4, .12, 200); },
  thud() { noise(.3, .26, 240); tone(95, .3, 'sine', .18, 38); },
  drop() { tone(1000, .3, 'triangle', .035, 180); },
  appear() { tone(660, .09, 'triangle', .05, 990); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .17, 'square', .045, null, i * .07)); },
  glitch() { noise(.22, .1, 3200); tone(140, .22, 'square', .05, 700); },
  saw() { tone(220, .5, 'sawtooth', .025, 330); }
};

/* ---------- particles & screen fx ---------- */
const parts = [];
const fx = { shake: 0, flash: 0, glitch: 0 };
function addShake(n) { fx.shake = Math.max(fx.shake, n); }
function emit(x, y, n, o) {
  for (let i = 0; i < n && parts.length < 420; i++) {
    const a = (o.angle ?? -Math.PI / 2) + (Math.random() - .5) * (o.spread ?? Math.PI * 2);
    const sp = (o.speed ?? 200) * (.35 + Math.random() * .85);
    const life = (o.life ?? .6) * (.6 + Math.random() * .6);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life, max: life,
      size: (o.size ?? 4) * (.6 + Math.random() * .8),
      color: Array.isArray(o.color) ? o.color[i % o.color.length] : o.color,
      g: o.g ?? 1200, rot: Math.random() * 6, vr: (Math.random() - .5) * 14 });
  }
}
const motes = Array.from({ length: 26 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: .8 + Math.random() * 1.8, s: 5 + Math.random() * 14 }));

/* ---------- levels: every title is a lie ---------- */
const LEVELS = [
  { lie: 'Just walk to the door.', truth: 'Mind the floor.', build($) {
    $.spawn(2);
    $.block(0, 14, 17, 4); const d = $.block(17, 14, 4, 4); $.block(21, 14, 11, 4);
    $.door(28, 14);
    $.when(p => p.x + p.w > 15 * T, () => $.drop(d, .12));
  }},
  { lie: 'Nothing to see here.', truth: 'Spikes. Everywhere.', build($) {
    $.spawn(2);
    $.block(0, 14, 10, 4); $.block(12, 14, 20, 4);
    $.block(10, 17, 2, 1); $.spikes(10, 17, 2);
    const s1 = $.spikes(15, 14, 2, 'up', { sunk: true });
    $.when(p => p.x + p.w > 13 * T, () => $.pop(s1));
    const s2 = $.spikes(24, 14, 2);
    $.when(p => p.x + p.w > 20 * T, () => { $.tween(s2, { x: 21 * T }, .28, 'in'); $.sfx('trap'); });
    $.door(28, 14);
  }},
  { lie: "The door won't move.", truth: "It's shy.", build($) {
    $.spawn(2);
    $.block(0, 14, 12, 4); const d = $.block(12, 14, 4, 4); $.block(16, 14, 16, 4);
    const door = $.door(26, 14);
    const sp = $.spikes(5, 14, 2, 'up', { sunk: true });
    $.when(p => p.x + p.w > 22 * T, () => {
      door.active = false; $.flag.moved = true; $.sfx('trap'); $.say('Nope.', 1.4);
      $.tween(door, { y: door.y - 110 }, .22, 'out', () =>
        $.tween(door, { x: 3 * T }, .7, 'inout', () =>
          $.tween(door, { y: 14 * T - 48 }, .22, 'in', () => { door.active = true; $.shake(6); $.sfx('thud'); })));
    });
    $.when(p => $.flag.moved && p.x < 16 * T + 10, () => $.drop(d, .08));
    $.when(p => $.flag.moved && p.x < 9 * T, () => $.pop(sp));
  }},
  { lie: 'Solid floor. Safe ceiling.', truth: 'Neither.', build($) {
    $.spawn(2);
    $.block(0, 14, 10, 4); $.block(16, 14, 16, 4);
    const cr = $.block(10, -4, 6, 10);
    $.spikes(10, 6, 6, 'down', { on: cr });
    $.when(p => p.x + p.w > 9 * T - 6, () => $.drop(cr, .22, { stopAt: 14 * T, onLand() { $.shake(12); $.sfx('thud'); $.dust(cr.x, cr.y, cr.w); } }));
    $.when(p => p.ground === cr, () => $.after(.45, () => { $.sfx('rumble'); $.tween(cr, { y: 14 * T + 260 }, 3.2, 'in'); }));
    const ce = $.block(21, -3, 7, 14);
    $.spikes(21, 11, 7, 'down', { on: ce });
    $.when(p => p.x + p.w > 21 * T + 4, () => { $.sfx('rumble'); $.tween(ce, { y: ce.y + 64 }, 1.5, 'in'); });
    $.door(29, 14);
  }},
  { lie: 'Every platform is solid.', truth: 'Some of them crumble.', build($) {
    $.spawn(2);
    $.block(0, 14, 7, 4); $.block(25, 14, 7, 4);
    $.block(7, 17, 18, 1); $.spikes(7, 17, 18);
    $.block(9, 12, 3, 1); const b = $.block(14, 11, 3, 1); const c = $.block(19, 12, 3, 1);
    $.when(p => p.ground === b, () => { $.drop(b, .32); $.tween(c, { y: 9 * T }, .6, 'inout'); });
    const s = $.spikes(25, 14, 3, 'up', { sunk: true });
    $.when(p => p.x > 22 * T - 10, () => $.pop(s));
    $.door(29, 14);
  }},
  { lie: 'Controls work as expected.', truth: 'Left is right. Sometimes.', build($) {
    $.spawn(2);
    $.block(0, 14, 32, 4);
    $.spikes(8, 14, 2); $.spikes(15, 14, 2); $.spikes(22, 14, 2);
    $.when(p => p.x > 11 * T, () => { $.lv.reversed = true; $.glitch(); $.say('Oh, by the way: left is right now.', 2.6); });
    $.when(p => p.x > 19 * T, () => { $.lv.reversed = false; $.glitch(); $.say("…and now it isn't.", 2.2); });
    $.door(28, 14);
  }},
  { lie: 'No moving parts.', truth: 'It comes back.', build($) {
    $.spawn(2);
    $.block(0, 14, 32, 4);
    const saw = $.saw(27 * T + 15, 14 * T + 32, 26, { spin: -10 });
    $.when(p => p.x > 9 * T, () => { $.sfx('saw'); $.tween(saw, { y: 14 * T - 26 }, .35, 'out', () => { saw.vx = -300; }); });
    $.when(p => saw.vx < 0 && saw.x < p.x - 70, () => $.after(.15, () => { if (saw.vx < 0) { saw.vx = 620; $.sfx('saw'); $.say('Forgot something?', 1.6); } }));

/* ---------- level builder ---------- */
function buildLevel(i) {
  const lv = { i, blocks: [], spikes: [], saws: [], doors: [], signs: [], triggers: [], timers: [], tweens: [], updaters: [], reversed: false, flag: {}, spawn: { x: 64, y: 14 * T - PH } };
  const api = {
    lv, flag: lv.flag,
    spawn(tx, ty = 14) { lv.spawn = { x: tx * T + 4, y: ty * T - PH }; },
    block(tx, ty, tw, th, o = {}) {
      const b = Object.assign({ kind: 'block', x: tx * T, y: ty * T, w: tw * T, h: th * T, solid: true, alpha: 1, vy: 0, wob: 0, off: false }, o);
      b.x0 = b.x; b.y0 = b.y; b.px = b.x; b.py = b.y;
      if (b.off) { b.solid = false; b.alpha = 0; }
      lv.blocks.push(b); return b;
    },
    spikes(tx, ty, n, dir = 'up', o = {}) {
      const s = Object.assign({ kind: 'spikes', x: tx * T, y: dir === 'up' ? ty * T - SH : ty * T, w: n * T, h: SH, dir, alpha: 1, off: false }, o);
      if (s.sunk) { s.base = s.y; s.y += SH + 2; }
      if (s.on) { s.ox = s.x - s.on.x; s.oy = s.y - s.on.y; }
      lv.spikes.push(s); return s;
    },
    door(tx, ty, o = {}) {
      const d = Object.assign({ kind: 'door', x: tx * T, y: ty * T - 48, w: 30, h: 48, active: true, alpha: 1, off: false }, o);
      if (d.off) { d.active = false; d.alpha = 0; }
      if (d.on) { d.ox = d.x - d.on.x; d.oy = d.y - d.on.y; }
      lv.doors.push(d); return d;
    },
    saw(x, y, r, o = {}) { const s = Object.assign({ kind: 'saw', x, y, r, vx: 0, vy: 0, rot: 0 }, o); lv.saws.push(s); return s; },
    sign(text, x, y) { lv.signs.push({ text, x, y }); },
    when(cond, fn) { lv.triggers.push({ cond, fn, done: false }); },
    after(t, fn) { lv.timers.push({ t, fn, done: false }); },
    every(fn) { lv.updaters.push(fn); },
    tween(obj, to, dur, ease = 'inout', cb) { const from = {}; for (const k in to) from[k] = obj[k]; lv.tweens.push({ obj, from, to, dur, t: 0, ease, cb }); },
    drop(b, delay = .14, o = {}) { Object.assign(b, o); b.wob = delay; b.pendingFall = true; b.vy = 0; if (!o.quiet) SFX.rumble(); },
    fall(s) { s.falling = true; s.vy = 0; SFX.drop(); },
    pop(s) { if (s.popped) return; s.popped = true; api.tween(s, { y: s.base }, .07, 'out'); SFX.shing(); },
    appear(o) {
      o.off = false; o.alpha = 0; api.tween(o, { alpha: 1 }, .3, 'out');
      if (o.kind === 'block') o.solid = true;
      if (o.kind === 'door') o.active = true;
      emit(o.x + o.w / 2, o.y + o.h / 2, 12, { color: [COL.sun, COL.bone], speed: 150, life: .5, size: 3, g: 0 });
      SFX.appear();
    },
    say(t, d) { toast(t, d); },
    shake(n) { addShake(n); },
    glitch() { fx.glitch = RM ? 0 : .35; SFX.glitch(); addShake(4); },
    sfx(n) { SFX[n] && SFX[n](); },
    dust(x, y, w) { for (let k = 0; k < w; k += 8) emit(x + k, y, 1, { color: 'rgba(242,239,255,.55)', speed: 110, spread: 1.4, angle: -Math.PI / 2, life: .55, size: 4, g: 260 }); },
    burst(x, y, c) { emit(x, y, 18, { color: c, speed: 240, life: .6, size: 4 }); }
  };
  LEVELS[i].build(api);
  return lv;
}

function stepPlayer(dt) {

function update(dt) {

  for (const m of motes) { m.y -= m.s * dt; m.x += Math.sin(game.clock * .5 + m.r * 3) * 4 * dt; if (m.y < -5) { m.y = H + 5; m.x = Math.random() * W; } }

  }

    if (r1 > .45) ctx.fillRect(x + i * T + 2 + ((r2 * 24) | 0), y + j * T + 2 + ((r1 * 24) | 0), 2, 2);
  }
  ctx.fillStyle = COL.inkHi; ctx.fillRect(x - .6, y, b.w + 1.2, 3);
  ctx.globalAlpha = 1;
}
function drawSpikes(s) {
  if (s.off || s.dead) return;
  const n = Math.max(1, Math.round(s.w / 15)), tw = s.w / n, up = s.dir === 'up';
  const base = up ? s.y + s.h : s.y, tip = up ? s.y : s.y + s.h;
  ctx.fillStyle = COL.coral; ctx.beginPath();
  for (let i = 0; i < n; i++) { const x0 = s.x + i * tw; ctx.moveTo(x0, base); ctx.lineTo(x0 + tw / 2, tip); ctx.lineTo(x0 + tw, base); }
  ctx.fill();
  ctx.fillStyle = COL.coralHi; ctx.beginPath();
  for (let i = 0; i < n; i++) { const x0 = s.x + i * tw; ctx.moveTo(x0 + 1.5, base); ctx.lineTo(x0 + tw / 2, tip); ctx.lineTo(x0 + tw / 2, base); }
  ctx.globalAlpha = .45; ctx.fill(); ctx.globalAlpha = 1;
  ctx.fillStyle = COL.coralDeep; ctx.fillRect(s.x, up ? base - 2 : base, s.w, 2);

function drawSaw(s) {
  ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
  const n = 12; ctx.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = i / (n * 2) * Math.PI * 2, r = i % 2 ? s.r * .76 : s.r; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath(); ctx.fillStyle = COL.coral; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, s.r * .55, 0, 6.283); ctx.fillStyle = COL.coralHi; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, s.r * .32, 0, 6.283); ctx.fillStyle = COL.ink; ctx.fill();
  ctx.fillStyle = COL.coralHi; ctx.fillRect(-1.5, -s.r * .3, 3, s.r * .6);
  ctx.restore();
}
function archPath(x, y, w, h) { const r = w / 2; ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x, y + r); ctx.arc(x + r, y + r, r, Math.PI, 0); ctx.lineTo(x + w, y + h); ctx.closePath(); }
function drawDoor(d) {
  const al = d.off ? 0 : d.alpha; if (al <= 0) return;
  ctx.globalAlpha = al;
  const { x, y, w, h } = d;
  if (d.active) {
    const g = ctx.createRadialGradient(x + w / 2, y + h / 2, 4, x + w / 2, y + h / 2, 64);
    g.addColorStop(0, `rgba(255,210,63,${.26 + .1 * Math.sin(game.clock * 3)})`); g.addColorStop(1, 'rgba(255,210,63,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 60, y - 50, w + 120, h + 100);
  }
  archPath(x, y, w, h); ctx.fillStyle = COL.bone; ctx.fill();
  archPath(x + 4, y + 4, w - 8, h - 4); ctx.fillStyle = COL.ink; ctx.fill();
  ctx.fillStyle = COL.sun; ctx.fillRect(x + 4, y + h - 3, w - 8, 3);
  ctx.beginPath(); ctx.arc(x + w - 10, y + 29, 2.4, 0, 6.283); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawSigns() {
  ctx.font = `500 15px ${FM}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (const s of L.signs) { ctx.fillStyle = 'rgba(242,239,255,.8)'; ctx.fillText(s.text, s.x, s.y); }
}
function drawPlayer() {
  const p = P; if (!p || p.dead) return;
  let cx = p.x + p.w / 2, by = p.y + p.h, sc = 1;
  if (p.enter) {
    const k = clamp(game.tt / .45, 0, 1);
    cx = p.enter.x0 + (p.enter.x - p.enter.x0) * k; by = p.enter.y0 + (p.enter.y - p.enter.y0) * k + 16 * k; sc = 1 - k;
    if (sc <= .02) return;
  }
  ctx.save(); ctx.translate(cx, by); ctx.scale(p.sx * sc, p.sy * sc);
  const w = p.w, h = p.h;
  ctx.fillStyle = 'rgba(6,8,40,.25)'; ctx.fillRect(-w / 2 + 2, -2, w - 4, 3);
  ctx.beginPath(); ctx.roundRect(-w / 2, -h, w, h, 7); ctx.fillStyle = COL.sunDeep; ctx.fill();
  ctx.beginPath(); ctx.roundRect(-w / 2, -h, w, h - 4, 7); ctx.fillStyle = COL.sun; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-w / 2 + 4, -h + 3, 5, 2);
  const ex = p.face * 3.5, ey = -h + 11;
  if (p.blink < 0) { ctx.fillStyle = COL.ink; ctx.fillRect(ex - 5, ey - 1, 10, 2.4); }
  else {
    ctx.beginPath(); ctx.arc(ex, ey, 6.4, 0, 6.283); ctx.fillStyle = COL.bone; ctx.fill();
    const px = ex + p.face * 1.6 + clamp(p.vx / SPEED, -1, 1) * 1, py = ey + clamp(p.vy / 700, -1, 1) * 2.2;
    ctx.beginPath(); ctx.arc(px, py, 3.1, 0, 6.283); ctx.fillStyle = COL.ink; ctx.fill();
  }

}
function drawParts() {
  for (const pt of parts) {
    ctx.globalAlpha = clamp(pt.life / pt.max, 0, 1); ctx.fillStyle = pt.color;
    ctx.save(); ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot); ctx.fillRect(-pt.size / 2, -pt.size / 2, pt.size, pt.size); ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function glitchFx() {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  const cw = canvas.width, ch = canvas.height;
  for (let i = 0; i < 6; i++) {
    const hh = Math.max(2, Math.floor(Math.random() * ch * .07)), y = Math.floor(Math.random() * (ch - hh)), dx = (Math.random() - .5) * cw * .05;
    ctx.drawImage(canvas, 0, y, cw, hh, dx, y, cw, hh);
  }
  ctx.fillStyle = 'rgba(255,79,109,.1)'; ctx.fillRect(0, 0, cw, ch);
  ctx.restore();
}
function drawHUD() {
  if (!L) return;
  const pad = clamp(CW * .018, 9, 18);
  const f1 = Math.round(clamp(CW * .021, 12, 20)), f2 = Math.round(clamp(CW * .0155, 10, 15));
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = `${f1}px ${FD}`;
  const lv = 'LEVEL ' + pad2(game.level + 1);
  ctx.fillStyle = COL.bone; ctx.fillText(lv, pad, pad + f1);
  const dx = pad + ctx.measureText(lv).width + f1 * .9;
  ctx.fillStyle = COL.sun; ctx.fillText('DEATHS ' + game.deaths, dx, pad + f1);
  ctx.font = `500 ${f2}px ${FM}`;
  const lie = '“' + LEVELS[game.level].lie + '”', y2 = pad + f1 + f2 + 7;
  ctx.fillStyle = 'rgba(242,239,255,.82)'; ctx.fillText(lie, pad, y2);
  if (game.levelDeaths > 0 && game.mode !== 'win') {
    const lw = ctx.measureText(lie).width, k = EASE.out(game.strike);
    ctx.fillStyle = COL.coral; ctx.fillRect(pad - 2, y2 - f2 * .36, (lw + 4) * k, Math.max(2, f2 * .15));
    if (k > .6) {
      ctx.globalAlpha = (k - .6) / .4;
      const tr = LEVELS[game.level].truth, tw = ctx.measureText(tr).width;
      ctx.fillStyle = COL.sun;
      if (pad + lw + f2 * .8 + tw < CW - 90) ctx.fillText(tr, pad + lw + f2 * .8, y2);
      else ctx.fillText(tr, pad, y2 + f2 + 5);
      ctx.globalAlpha = 1;
    }
  }
}
function drawBanner() {
  if (banner.t <= 0) return;
  const age = banner.dur - banner.t, al = clamp(Math.min(age / .25, banner.t / .45), 0, 1);
  const big = clamp(CW * .085, 26, 82), sm = clamp(CW * .021, 10, 19), cy = CH * .42 - (1 - al) * 10;
  ctx.globalAlpha = al * .5; ctx.fillStyle = COL.ink; ctx.fillRect(0, cy - big * 1.35, CW, big * 2.25);
  ctx.globalAlpha = al; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = `500 ${sm}px ${FM}`; ctx.fillStyle = COL.sun;
  ctx.fillText(`PROMISE #${pad2(game.level + 1)} OF ${LEVELS.length}`, CW / 2, cy - big * .88);
  ctx.font = `${big}px ${FD}`;
  const t = 'LEVEL ' + pad2(game.level + 1);
  ctx.fillStyle = COL.coral; ctx.fillText(t, CW / 2 + big * .055, cy + big * .055);
  ctx.fillStyle = COL.bone; ctx.fillText(t, CW / 2, cy);
  ctx.font = `500 ${sm * 1.18}px ${FM}`; ctx.fillStyle = COL.bone;
  ctx.fillText('“' + LEVELS[game.level].lie + '”', CW / 2, cy + big * .62);
  ctx.globalAlpha = 1;
}
function drawToast() {
  if (toastS.t <= 0 || !toastS.text) return;
  const age = toastS.dur - toastS.t, al = clamp(Math.min(age / .15, toastS.t / .3), 0, 1);
  const f = Math.round(clamp(CW * .021, 11, 19));
  ctx.font = `500 ${f}px ${FM}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tw = ctx.measureText(toastS.text).width, ph = f * 2.1, pw = Math.min(CW - 20, tw + f * 2), y = CH * .27 + (1 - al) * 8;
  ctx.globalAlpha = al * .9; ctx.fillStyle = COL.ink;
  ctx.beginPath(); ctx.roundRect(CW / 2 - pw / 2, y - ph / 2, pw, ph, ph / 2); ctx.fill();
  ctx.globalAlpha = al; ctx.strokeStyle = 'rgba(255,210,63,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = COL.sun; ctx.fillText(toastS.text, CW / 2, y + 1);
  ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
}
function drawWipe() {
  let a, b;
  if (game.mode === 'end') { a = 0; b = 1; }
  else if (game.mode === 'win') {
    const t = game.tt;
    if (t < .45) return;
    if (t < .85) { a = 0; b = EASE.inout((t - .45) / .4); }
    else if (t < 1.6) { a = 0; b = 1; }
    else { a = EASE.inout(Math.min(1, (t - 1.6) / .4)); b = 1; }
  } else return;
  const sk = CH * .28, span = CW + sk * 2, Lx = a * span - sk, Rx = b * span - sk;
  ctx.fillStyle = COL.ink; ctx.beginPath();
  ctx.moveTo(Lx + sk, 0); ctx.lineTo(Rx + sk, 0); ctx.lineTo(Rx, CH); ctx.lineTo(Lx, CH); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = COL.coral; ctx.lineWidth = 6;
  if (b < 1) { ctx.beginPath(); ctx.moveTo(Rx + sk, 0); ctx.lineTo(Rx, CH); ctx.stroke(); }
  if (a > 0) { ctx.beginPath(); ctx.moveTo(Lx + sk, 0); ctx.lineTo(Lx, CH); ctx.stroke(); }
  if (game.mode === 'win' && game.tt > .8 && game.tt < 1.75) {
    const al = clamp(Math.min((game.tt - .8) / .15, (1.75 - game.tt) / .15), 0, 1);
    const big = clamp(CW * .06, 18, 58), sm = clamp(CW * .02, 10, 18);
    ctx.globalAlpha = al; ctx.textAlign = 'center';
    ctx.font = `500 ${sm}px ${FM}`; ctx.fillStyle = 'rgba(242,239,255,.7)';
    ctx.fillText('“' + LEVELS[game.exposed].lie + '”', CW / 2, CH * .5 - big * 1.05);
    ctx.font = `${big}px ${FD}`; ctx.fillStyle = COL.coral; ctx.fillText(`LIE #${pad2(game.exposed + 1)} EXPOSED`, CW / 2 + big * .05, CH * .5 + big * .05);
    ctx.fillStyle = COL.sun; ctx.fillText(`LIE #${pad2(game.exposed + 1)} EXPOSED`, CW / 2, CH * .5);
    ctx.font = `500 ${sm * 1.1}px ${FM}`; ctx.fillStyle = COL.bone;
    ctx.fillText('The truth: ' + LEVELS[game.exposed].truth, CW / 2, CH * .5 + big * .95);

}
function render() {
  if (!L) return;
  const k = S * DPR;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  let sx = 0, sy = 0;
  if (fx.shake > 0) { const m = RM ? .3 : 1; sx = (Math.random() * 2 - 1) * fx.shake * m; sy = (Math.random() * 2 - 1) * fx.shake * m; }
  ctx.setTransform(k, 0, 0, k, sx * k, sy * k);
  drawBg();
  for (const s of L.saws) drawSaw(s);
  for (const s of L.spikes) drawSpikes(s);
  for (const b of L.blocks) drawBlock(b);
  for (const d of L.doors) drawDoor(d);
  drawSigns(); drawPlayer(); drawParts();
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  if (fx.glitch > 0) glitchFx();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawHUD(); drawBanner(); drawToast();
  if (fx.flash > 0) { ctx.fillStyle = `rgba(255,79,109,${fx.flash * .32})`; ctx.fillRect(0, 0, CW, CH); }
  drawWipe();
}

let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now; if (dt > .1) dt = .1;
  if (!game.manual) { acc += dt; let n = 0; while (acc >= STEP && n < 14) { update(STEP); acc -= STEP; n++; } if (n >= 14) acc = 0; }
  render(); requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
const menu = q('#menu'), endO = q('#end'), bPlay = q('#bPlay'), bNew = q('#bNew'), bSound = q('#bSound');
const isTouch = () => document.body.classList.contains('touch');
function fmtTime(s) { s = Math.round(s); return Math.floor(s / 60) + ':' + pad2(s % 60); }
function showMenu(paused) {
  game.paused = !!paused;
  if (paused) { bPlay.textContent = 'Resume'; bNew.hidden = false; bNew.textContent = 'Restart run'; }
  else if (store.run && (store.run.level > 0 || store.run.deaths > 0)) { bPlay.textContent = `Continue · Level ${store.run.level + 1}`; bNew.hidden = false; bNew.textContent = 'New run'; }
  else { bPlay.textContent = 'Play'; bNew.hidden = true; }
  bSound.textContent = 'Sound: ' + (store.muted ? 'off' : 'on');
  q('#best').innerHTML = store.best ? `Best run: <b>${store.best.deaths}</b> deaths in <b>${fmtTime(store.best.time)}</b>` : '';
  q('#hint').innerHTML = isTouch()
    ? 'Hold <kbd>◀</kbd> <kbd>▶</kbd> to run, tap <kbd>JUMP</kbd> to jump. Every trap fires the same way every time, so each death teaches you something.'
    : 'Move with <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd>. Jump with <kbd>↑</kbd> <kbd>W</kbd> or <kbd>Space</kbd>. <kbd>R</kbd> restarts, <kbd>Esc</kbd> pauses. Every trap fires the same way every time.';
  menu.hidden = false;
}
function startRun(level, deaths, time) {
  unlockAudio();
  menu.hidden = true; endO.hidden = true; game.paused = false;
  game.level = level; game.deaths = deaths; game.runTime = time; game.levelDeaths = 0; game.strike = 0;
  L = buildLevel(level); resetPlayer(); game.mode = 'play'; parts.length = 0; showBanner(); persistRun();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function resume() { unlockAudio(); game.paused = false; menu.hidden = true; if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }
function pause() { if (game.mode === 'play' || game.mode === 'dead' || game.mode === 'win') showMenu(true); }
function finishRun() {
  game.mode = 'end';
  const res = { deaths: game.deaths, time: Math.round(game.runTime) };
  if (!store.best || res.deaths < store.best.deaths) store.best = res;
  store.run = null; save();
  const d = res.deaths;
  const verdict = d <= 10 ? "Either you're a genius or you're lying too." : d <= 25 ? 'Suspiciously competent. We are watching you.'
    : d <= 50 ? 'Respectably stubborn. The floor respects you. (It does not.)' : d <= 100 ? 'The floor will miss you. It got to know you well.'
    : 'You and the floor are family now.';
  q('#eDeaths').textContent = d; q('#eTime').textContent = fmtTime(res.time); q('#eVerdict').textContent = verdict;
  q('#eShare').textContent = `I beat LEVEL LIAR with ${d} deaths in ${fmtTime(res.time)}. Every level lied to me.`;
  q('#bCopy').textContent = 'Copy result';
  endO.hidden = false;
}
bPlay.addEventListener('click', () => {
  if (game.paused) resume();
  else if (store.run) startRun(Math.min(store.run.level, LEVELS.length - 1), store.run.deaths || 0, store.run.time || 0);
  else startRun(0, 0, 0);
});
bNew.addEventListener('click', () => startRun(0, 0, 0));
bSound.addEventListener('click', () => { store.muted = !store.muted; save(); unlockAudio(); bSound.textContent = 'Sound: ' + (store.muted ? 'off' : 'on'); });
q('#bAgain').addEventListener('click', () => startRun(0, 0, 0));
q('#bCopy').addEventListener('click', () => {
  const text = q('#eShare').textContent, btn = q('#bCopy');
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(q('#eShare')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Selected. Copy it'; };
  try { navigator.clipboard.writeText(text).then(() => { btn.textContent = 'Copied'; }, fallback); } catch (e) { fallback(); }
});
q('#bRestart').addEventListener('click', e => { e.currentTarget.blur(); unlockAudio(); restartLevel(); });
q('#bPause').addEventListener('click', e => { e.currentTarget.blur(); pause(); });

addEventListener('keydown', e => {
  unlockAudio();
  const c = e.code, playing = menu.hidden && endO.hidden;
  if (playing && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(c)) e.preventDefault();
  if (e.repeat) return;
  keys.add(c);
  if (playing && ['ArrowUp', 'KeyW', 'Space', 'KeyZ'].includes(c)) pressJump();
  if (playing && c === 'KeyR') restartLevel();
  if (c === 'Escape' || c === 'KeyP') { if (game.paused) resume(); else if (playing) pause(); }
  if (c === 'KeyM') { store.muted = !store.muted; save(); }
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => { keys.clear(); touch.left = touch.right = touch.jump = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && !game.paused && menu.hidden && endO.hidden) pause(); });

/* touch pad */
const dpad = q('#dpad'), bL = q('#bL'), bR = q('#bR'), bJ = q('#bJ');
const dpadPtrs = new Map();
function sideOf(e) { const r = dpad.getBoundingClientRect(); return e.clientX < r.left + r.width / 2 ? -1 : 1; }
function syncDpad() {
  let l = false, r = false; for (const s of dpadPtrs.values()) { if (s < 0) l = true; else r = true; }
  touch.left = l; touch.right = r; bL.classList.toggle('on', l); bR.classList.toggle('on', r);
}
dpad.addEventListener('pointerdown', e => { e.preventDefault(); unlockAudio(); try { dpad.setPointerCapture(e.pointerId); } catch (x) {} dpadPtrs.set(e.pointerId, sideOf(e)); syncDpad(); });

for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) dpad.addEventListener(t, e => { dpadPtrs.delete(e.pointerId); syncDpad(); });
const jumpPtrs = new Set();
bJ.addEventListener('pointerdown', e => { e.preventDefault(); unlockAudio(); try { bJ.setPointerCapture(e.pointerId); } catch (x) {} jumpPtrs.add(e.pointerId); touch.jump = true; bJ.classList.add('on'); pressJump(); });
for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) bJ.addEventListener(t, e => { jumpPtrs.delete(e.pointerId); if (!jumpPtrs.size) { touch.jump = false; bJ.classList.remove('on'); } });
for (const el of [dpad, bJ, q('#pad')]) el.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

function setTouch() { if (!document.body.classList.contains('touch')) { document.body.classList.add('touch'); resize(); if (!menu.hidden) showMenu(game.paused); } }
if (window.matchMedia && matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
addEventListener('touchstart', setTouch, { passive: true });
addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap);

/* test & hot-reload hooks */
window.__levelLiar = {
  game, LEVELS, banner, toast: toastS, fx, input: testIn, get P() { return P; }, get L() { return L; },
  step(n) { for (let i = 0; i < n; i++) update(STEP); }, start(i) { startRun(i, 0, 0); }, jump() { pressJump(); }
};
try { window.claude?.hot?.snapshot?.(() => ({ level: game.level, deaths: game.deaths, time: game.runTime, mode: game.mode, paused: game.paused })); } catch (e) {}

function boot(data) {
  resize(); makeBgPattern();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(makeBgPattern).catch(() => {});
  const lvl = store.run ? Math.min(store.run.level || 0, LEVELS.length - 1) : 0;
  game.level = lvl; L = buildLevel(lvl); resetPlayer();
  if (data && typeof data.level === 'number' && ['play', 'dead', 'win'].includes(data.mode)) {
    startRun(Math.min(data.level, LEVELS.length - 1), data.deaths || 0, data.time || 0);
    if (data.paused) showMenu(true);
  } else { game.mode = 'menu'; showMenu(false); }
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
